# Plant Disease Detection Configuration

# Data Configuration
data:
  dataset_path: "data/raw/PlantVillage"
  image_size: [224, 224]
  batch_size: 32
  num_classes: 38
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  random_seed: 42

# Augmentation Configuration (Training only)
augmentation:
  rescale: 0.00392156862745098 # 1/255
  rotation_range: 40
  width_shift_range: 0.2
  height_shift_range: 0.2
  shear_range: 0.2
  zoom_range: 0.2
  horizontal_flip: true
  vertical_flip: true
  fill_mode: "nearest"

# Model Architecture Configuration
model:
  name: "PlantDiseaseNet"
  input_shape: [224, 224, 3]

  # Convolutional blocks: [filters per layer, dropout_rate]
  conv_blocks:
    - filters: [32, 32]
      kernel_size: 3
      dropout: 0.25
      pool_size: 2

    - filters: [64, 64]
      kernel_size: 3
      dropout: 0.25
      pool_size: 2

    - filters: [128, 128]
      kernel_size: 3
      dropout: 0.3
      pool_size: 2

    - filters: [256, 256]
      kernel_size: 3
      dropout: 0.3
      pool_size: 2

  # Dense layers configuration
  dense_layers: [512, 256]
  dense_dropout: 0.5

  # Output
  num_classes: 38
  activation: "relu"
  output_activation: "softmax"

# Training Configuration
training:
  epochs: 40
  initial_lr: 0.001
  optimizer: "adam"
  loss: "categorical_crossentropy"
  metrics:
    - "accuracy"
    - "top_k_categorical_accuracy"

  # Adam optimizer parameters
  optimizer_params:
    beta_1: 0.9
    beta_2: 0.999
    epsilon: 1.0e-7

  # Callbacks Configuration
  callbacks:
    early_stopping:
      monitor: "val_loss"
      patience: 10
      restore_best_weights: true
      verbose: 1

    reduce_lr:
      monitor: "val_loss"
      factor: 0.5
      patience: 3
      min_lr: 1.0e-7
      verbose: 1

    model_checkpoint:
      monitor: "val_accuracy"
      mode: "max"
      save_best_only: true
      filepath: "models/saved_models/best_model.keras"
      verbose: 1

    csv_logger:
      filename: "models/saved_models/training_history.csv"
      append: false

    tensorboard:
      log_dir: "logs/fit"
      histogram_freq: 1
      write_graph: true

# Paths
paths:
  data_root: "data"
  raw_data: "data/raw"
  processed_data: "data/processed"
  splits_data: "data/splits"
  models: "models/saved_models"
  logs: "logs"
  results: "results"
  plots: "results/plots"
  checkpoints: "models/checkpoints"

# Kaggle Dataset
kaggle:
  dataset: "abdallahalidev/plantvillage-dataset"
  download_path: "data/raw"
